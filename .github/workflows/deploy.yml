name: Deploy to AWS Lambda

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform
  ECR_REPO: botanical-agent-prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build --push --provenance=false --sbom=false \
            -t $ECR_REGISTRY/$ECR_REPO:latest \
            -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG \
            -f Dockerfile.lambda .

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name $ECR_REPO \
            --image-uri ${{ steps.login-ecr.outputs.registry }}/$ECR_REPO:${{ github.sha }} \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Lambda to be ready
        run: |
          aws lambda wait function-updated --function-name $ECR_REPO --region ${{ env.AWS_REGION }}

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name $ECR_REPO \
            --environment "Variables={NODE_ENV=production,PORT=3000,GROQ_API_KEY=${{ secrets.GROQ_API_KEY }},PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }},PINECONE_HOST=${{ secrets.PINECONE_HOST }},HF_TOKEN=${{ secrets.HF_TOKEN || 'none' }},HUGGINGFACE_API_KEY=${{ secrets.HF_TOKEN || 'none' }}}" \
            --region ${{ env.AWS_REGION }}
